<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hack Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
:root {
  --orange:      #E8782A;
  --orange-lt:   #F5A040;
  --orange-glow: rgba(232,120,42,0.55);
  --cream:       #FEF0D8;
  --cream-box:   rgba(254,243,222,0.82);
  --cream-hover: rgba(254,243,222,0.95);
  --dark-pill:   rgba(20,10,4,0.72);
  --dark-pill-h: rgba(20,10,4,0.88);
  --fg-light:    rgba(255,255,255,0.92);
  --fg-muted:    rgba(255,255,255,0.6);
  --shadow:      rgba(30,14,4,0.45);
  --portal-void: #060402;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: 'Host Grotesk', system-ui, sans-serif;
}

[hidden] { display: none !important; }

/* ================================================================
 * BACKGROUND
 * ================================================================ */
.bg {
  position: fixed; inset: 0; z-index: 0;
}
.bg-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 20%;
}
/* Slight darken for legibility */
.bg::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(20, 10, 4, 0.18);
}

/* ================================================================
 * CORNER DECORATIONS — fixed, z above bg below UI
 * ================================================================ */
.deco { position: fixed; pointer-events: none; z-index: 1; }

.deco-cloud-tl {
  top: 0; left: 0;
  width: clamp(70px, 13vw, 180px);
  transform: rotate(180deg);
  mix-blend-mode: multiply;
  filter: brightness(1.05) contrast(1.05);
}
.deco-cloud-tr {
  top: 0; right: 0;
  width: clamp(70px, 13vw, 180px);
  mix-blend-mode: multiply;
  filter: brightness(1.05) contrast(1.05);
}

/* Hedgehog: glowing wrapper + bright mascot */
.deco-hog-wrap {
  bottom: -6px;
  left: clamp(8px, 3vw, 32px);
  width: clamp(90px, 14vw, 160px);
}
.deco-hog {
  position: relative; z-index: 1;
  width: 100%;
  display: block;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3));
}

/* ================================================================
 * APP SHELL
 * ================================================================ */
#app {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 0 16px;
}

/* ================================================================
 * HACK CLUB WORDMARK — top of setup screen
 * ================================================================ */
.hc-wordmark {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 28px;
  text-decoration: none;
}
.hc-flag {
  width: 32px; height: 32px;
  background: #EC3750;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.hc-flag svg { width: 18px; height: 18px; fill: white; }
.hc-name {
  font-family: 'Host Grotesk', sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--fg-light);
  letter-spacing: -0.01em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
}

/* ================================================================
 * SETUP SCREEN — floating on background, Jumbotron style
 * ================================================================ */
#setup-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  width: 100%;
  max-width: 480px;
  animation: fadeUp 0.35s ease;
  padding-bottom: 24px;
}

.setup-title {
  font-family: 'Darumadrop One', cursive;
  font-size: clamp(3rem, 10vw, 5rem);
  color: var(--cream);
  margin: 0 0 6px;
  line-height: 1.0;
  text-align: center;
  text-shadow: 3px 5px 0 rgba(40,18,4,0.55);
}
.setup-sub {
  font-size: 0.88rem;
  color: var(--fg-muted);
  margin: 0 0 28px;
  text-align: center;
  letter-spacing: 0.01em;
}

/* City input — minimal floating field */
.city-wrap {
  width: 100%;
  margin-bottom: 20px;
  position: relative;
}
.city-label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  text-align: center;
}
.city-input {
  width: 100%;
  padding: 13px 20px;
  border-radius: 50px;
  border: 2px solid rgba(254,240,216,0.25);
  background: rgba(254,240,216,0.14);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-family: 'Host Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 500;
  color: white;
  text-align: center;
  outline: none;
  transition: border-color 0.18s, background 0.18s;
  -webkit-appearance: none;
}
.city-input::placeholder { color: rgba(255,255,255,0.4); }
.city-input:focus {
  border-color: rgba(254,240,216,0.55);
  background: rgba(254,240,216,0.2);
}

/* ——— Tabs: Create / Join ——— */
.tab-row {
  display: flex;
  gap: 4px;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  border-radius: 50px;
  padding: 4px;
  margin-bottom: 22px;
}
.tab-btn {
  flex: 1;
  padding: 9px 24px;
  border-radius: 50px;
  border: none;
  font-family: 'Host Grotesk', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  background: transparent;
  color: var(--fg-muted);
}
.tab-btn.active {
  background: var(--cream-box);
  color: #3D2412;
  box-shadow: 0 1px 6px rgba(0,0,0,0.25);
}

/* ——— CREATE panel ——— */
#panel-create {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.create-label {
  font-size: 0.75rem;
  color: var(--fg-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  text-align: center;
}
.code-display-row {
  display: flex;
  gap: 8px;
  justify-content: center;
}
.code-display-box {
  width: 52px; height: 60px;
  background: var(--cream-box);
  backdrop-filter: blur(10px);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Darumadrop One', cursive;
  font-size: 1.8rem;
  color: #3D2412;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.4) inset;
  cursor: pointer;
  user-select: none;
  transition: background 0.14s;
}
.code-display-box:hover { background: var(--cream-hover); }

.btn-primary {
  width: 100%;
  max-width: 280px;
  padding: 14px 24px;
  border-radius: 50px;
  border: none;
  font-family: 'Host Grotesk', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s, background 0.14s;
  background: var(--orange);
  color: white;
  box-shadow: 0 4px 20px rgba(232,120,42,0.5);
  letter-spacing: 0.01em;
}
.btn-primary:hover { background: var(--orange-lt); }
.btn-primary:active { transform: translateY(2px); }

/* ——— JOIN panel ——— */
#panel-join {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* Individual digit boxes */
.digit-row {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.digit-box {
  width: 52px; height: 60px;
  background: var(--cream-box);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 14px;
  border: 2px solid transparent;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Darumadrop One', cursive;
  font-size: 1.8rem;
  color: #3D2412;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.4) inset;
  cursor: text;
  transition: border-color 0.15s, background 0.15s;
  position: relative;
  user-select: none;
}
.digit-box.focused {
  border-color: var(--orange);
  background: var(--cream-hover);
  box-shadow: 0 0 0 3px var(--orange-glow), 0 4px 16px rgba(0,0,0,0.25);
}
.digit-box.filled { background: var(--cream-hover); }

/* Hidden real input behind digit boxes */
.digit-input-hidden {
  position: absolute;
  opacity: 0;
  width: 1px; height: 1px;
  pointer-events: none;
}

.btn-ghost-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 12px 24px;
  border-radius: 50px;
  border: none;
  font-family: 'Host Grotesk', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.14s;
  background: var(--dark-pill);
  color: var(--fg-light);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.btn-ghost-pill:hover { background: var(--dark-pill-h); }
.btn-ghost-pill:active { transform: translateY(1px); }

.setup-status {
  min-height: 1.2em;
  font-size: 0.8rem;
  color: rgba(255,220,160,0.9);
  text-align: center;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

/* ================================================================
 * TOAST
 * ================================================================ */
.toast {
  position: fixed; top: 18px; left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  border-radius: 50px;
  z-index: 999;
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.ok  { background: rgba(50,110,35,0.95); color: white; }
.toast.err { background: rgba(150,35,20,0.95); color: white; }

/* ================================================================
 * PORTAL SCREEN
 * ================================================================ */
#portal-screen {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  animation: fadeUp 0.3s ease;
}

/* Top bar */
.portal-topbar {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-shrink: 0;
}
.portal-topbar h1 {
  font-family: 'Darumadrop One', cursive;
  font-size: clamp(1.3rem, 3.5vw, 1.9rem);
  color: var(--cream);
  margin: 0;
  text-shadow: 2px 3px 0 rgba(40,18,4,0.5);
}
.portal-topbar h1 .city-span { color: var(--orange-lt); }

.topbar-right {
  display: flex; align-items: center; gap: 8px;
}
.code-badge {
  font-family: 'Darumadrop One', cursive;
  font-size: 1.1rem;
  letter-spacing: 0.12em;
  color: var(--cream);
  background: rgba(0,0,0,0.42);
  backdrop-filter: blur(8px);
  padding: 6px 16px;
  border-radius: 50px;
  cursor: pointer;
  border: 1px solid rgba(254,240,216,0.2);
  transition: background 0.14s;
}
.code-badge:hover { background: rgba(0,0,0,0.6); }
.btn-sm-pill {
  padding: 7px 16px;
  border-radius: 50px;
  border: none;
  font-family: 'Host Grotesk', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.14s;
}
.btn-leave { background: rgba(180,40,20,0.75); color: white; backdrop-filter: blur(6px); }
.btn-leave:hover { background: rgba(200,50,30,0.9); }
.btn-toggle { background: rgba(0,0,0,0.42); color: var(--fg-light); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15); }
.btn-toggle:hover { background: rgba(0,0,0,0.65); }

/* ================================================================
 * PORTAL FRAME
 * ================================================================ */
.portal-wrap {
  flex: 1;
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}
.portal-frame {
  position: relative;
  width: 100%;
  max-height: calc(100vh - 160px);
  aspect-ratio: 16/9;
  border-radius: 24px;
  overflow: hidden;
  background: var(--portal-void);
  box-shadow:
    0 0 0 3px var(--orange),
    0 0 24px var(--orange-glow),
    0 0 70px rgba(232,120,42,0.18),
    0 24px 70px rgba(20,8,2,0.65);
}

/* ——— WAITING ——— */
#state-waiting video {
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.35;
}
.waiting-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.waiting-inner {
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
}
.waiting-inner p {
  font-size: 0.88rem;
  color: rgba(255,255,255,0.65);
  margin: 0;
}
.waiting-code-row {
  display: flex; gap: 8px;
}
.waiting-code-box {
  width: 48px; height: 56px;
  background: rgba(254,240,216,0.18);
  border: 1.5px solid rgba(254,240,216,0.35);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Darumadrop One', cursive;
  font-size: 1.6rem;
  color: var(--cream);
  cursor: pointer;
  transition: background 0.14s;
}
.waiting-code-box:hover { background: rgba(254,240,216,0.28); }
.copy-hint {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.4);
  margin: 0;
}
.portal-pulse {
  position: absolute; inset: 0;
  border-radius: 24px;
  border: 3px solid var(--orange);
  animation: portalPulse 2.8s ease-out infinite;
  pointer-events: none; z-index: 10;
}
.waiting-bg-village {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.12;
}
@keyframes portalPulse {
  0%   { opacity: 0.7; transform: scale(1); }
  65%  { opacity: 0;   transform: scale(1.022); }
  100% { opacity: 0;   transform: scale(1.022); }
}

/* ——— Shared remote video ——— */
.remote-video-full {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.city-overlay {
  position: absolute;
  bottom: 14px; left: 18px;
  pointer-events: none; z-index: 6;
}
.city-haven-lbl {
  display: block;
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--orange-lt);
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  font-weight: 700;
}
.city-name-lbl {
  display: block;
  font-family: 'Darumadrop One', cursive;
  font-size: clamp(1rem, 2.8vw, 1.6rem);
  color: white;
  text-shadow: 0 2px 10px rgba(0,0,0,0.75);
}
/* Self PiP */
.self-pip {
  position: absolute;
  bottom: 12px; right: 12px;
  width: clamp(80px, 13%, 148px);
  aspect-ratio: 16/9;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid var(--orange);
  box-shadow: 0 3px 16px rgba(0,0,0,0.6);
  z-index: 7;
}
.self-pip video { width: 100%; height: 100%; object-fit: cover; }
.pip-label {
  position: absolute;
  bottom: 4px; left: 7px;
  font-family: 'Darumadrop One', cursive;
  font-size: 0.6rem;
  color: white;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  pointer-events: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: calc(100% - 14px);
}
/* Rotation badge */
.rotation-badge {
  position: absolute;
  top: 12px; right: 12px;
  background: rgba(0,0,0,0.55);
  color: var(--orange-lt);
  border-radius: 50px;
  padding: 5px 14px;
  font-size: 0.75rem;
  font-weight: 600;
  z-index: 8;
  backdrop-filter: blur(6px);
}
.rotate-nav {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(254,240,216,0.25);
  color: var(--cream);
  border-radius: 50%;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 9;
  font-size: 1.2rem;
  backdrop-filter: blur(6px);
  transition: background 0.14s;
  user-select: none;
}
.rotate-nav:hover { background: rgba(232,120,42,0.35); }
.rotate-nav.prev { left: 12px; }
.rotate-nav.next { right: 12px; }

/* Gallery */
#state-gallery {
  display: grid !important;
  gap: 3px; padding: 3px;
}
.grid-cell {
  position: relative;
  overflow: hidden;
  border-radius: 7px;
  background: var(--portal-void);
  min-height: 0;
}
.grid-cell video,
.grid-cell .no-cam-ph { width: 100%; height: 100%; object-fit: cover; }
.grid-label {
  position: absolute;
  bottom: 6px; left: 8px;
  font-family: 'Darumadrop One', cursive;
  font-size: 0.65rem;
  color: white;
  text-shadow: 0 1px 5px rgba(0,0,0,0.9);
  pointer-events: none;
}
.grid-cell.self-cell { outline: 2px solid rgba(232,120,42,0.6); outline-offset: -2px; }

/* No-camera placeholder */
.no-cam-ph {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  background: #120a04;
  color: rgba(254,240,216,0.5);
  font-size: 0.8rem;
}
.no-cam-city {
  font-family: 'Darumadrop One', cursive;
  font-size: 1rem;
  color: var(--orange-lt);
}
.no-cam-hog { width: 36px; height: 36px; object-fit: contain; opacity: 0.7; }

/* ================================================================
 * BOTTOM CHIPS
 * ================================================================ */
.portal-footer {
  width: 100%; max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}
.peer-chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip {
  display: flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,0.42);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50px;
  padding: 5px 12px;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--fg-light);
  white-space: nowrap;
}
.chip-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.chip-dot.live { background: #4ade80; }
.chip-dot.wait { background: #fb923c; }
.chip-dot.self { background: var(--orange); }
.footer-right { display: flex; gap: 7px; align-items: center; flex-shrink: 0; }
.status-pill {
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--fg-muted);
}

/* Media control buttons */
.media-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.14s, transform 0.08s;
  flex-shrink: 0;
  background: rgba(0,0,0,0.42);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.12);
}
.media-btn:hover { background: rgba(0,0,0,0.65); }
.media-btn:active { transform: scale(0.9); }
.media-btn.muted { background: rgba(200,40,20,0.75); border-color: rgba(255,80,60,0.3); }
.media-btn svg { width: 16px; height: 16px; fill: white; pointer-events: none; }

/* Settings modal */
.settings-backdrop {
  position: fixed; inset: 0;
  background: rgba(10,5,2,0.6);
  backdrop-filter: blur(6px);
  z-index: 50;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.settings-panel {
  background: rgba(30,16,6,0.92);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(254,240,216,0.15);
  border-radius: 24px;
  padding: 24px;
  width: min(420px, calc(100vw - 32px));
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }

.settings-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.settings-title {
  font-family: 'Darumadrop One', cursive;
  font-size: 1.4rem;
  color: var(--cream);
  margin: 0;
}
.settings-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.08);
  color: var(--fg-muted);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.14s;
}

<script>
(function(){
  const img = document.getElementById('hog-sprite');
  const BASE    = 'images/hog-base.png';
  const SLEEP   = 'images/hog-sleeping.png';
  const YAWN    = 'images/hog-yawning.png';
  const WINK    = 'images/hog-winking.png';

  function rand(lo, hi) { return lo + Math.random() * (hi - lo); }

  function idle() {
    // pick next event: blink (common), wink, yawn (rare)
    const r = Math.random();
    if (r < 0.60) {
      // blink: eyes close for ~130ms then reopen
      img.src = SLEEP;
      setTimeout(() => { img.src = BASE; schedule(); }, 130);
    } else if (r < 0.80) {
      // double-blink
      img.src = SLEEP;
      setTimeout(() => { img.src = BASE; }, 130);
      setTimeout(() => { img.src = SLEEP; }, 320);
      setTimeout(() => { img.src = BASE; schedule(); }, 450);
    } else if (r < 0.92) {
      // wink
      img.src = WINK;
      setTimeout(() => { img.src = BASE; schedule(); }, 700);
    } else {
      // yawn: eyes close, mouth opens, holds, back
      img.src = YAWN;
      setTimeout(() => { img.src = BASE; schedule(); }, 2200);
    }
  }

  function schedule() {
    setTimeout(idle, rand(2500, 6000));
  }

  schedule();
})();

<script>
// ================================================================
// HAVEN PORTAL — PeerJS WebRTC
// ================================================================

let rotationSec = 15 * 60; // configurable
const DIGITS = 6;

let myPeer = null, myId = null, myStream = null;
let cityName = '', roomCode = '';
let isHost = false, viewMode = 'rotate';
let micMuted = false, camOff = false;
let rotateIndex = 0, rotateSecondsLeft = rotationSec, rotateTimerId = null;
const peers = new Map(); // peerId -> { dataConn, call, stream, cityName }

// ——— Utilities ———
const $id = id => document.getElementById(id);

let toastTimer = null;
function showToast(msg, type = 'ok') {
  const el = $id('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
function setStatus(id, msg) {
  const el = $id(id);
  if (el) el.textContent = msg;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function generateCode() {
  return Math.floor(100000 + Math.random() * 900000).toString();
}

function copyToClipboard(text) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Copied!', 'ok')).catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;';
  document.body.appendChild(ta); ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  showToast('Copied!', 'ok');
}

// ——— Code display boxes ———
let generatedCode = generateCode();

function renderCodeDisplay(code, containerId) {
  const row = $id(containerId);
  row.innerHTML = '';
  code.split('').forEach(ch => {
    const box = document.createElement('div');
    box.className = 'code-display-box';
    box.textContent = ch;
    row.appendChild(box);
  });
}
function renderWaitingCode(code) {
  const row = $id('waiting-code-row');
  row.innerHTML = '';
  code.split('').forEach(ch => {
    const box = document.createElement('div');
    box.className = 'waiting-code-box';
    box.textContent = ch;
    row.appendChild(box);
  });
}

renderCodeDisplay(generatedCode, 'create-code-row');

// ——— Digit input boxes ———
let digitValues = Array(DIGITS).fill('');
let currentDigit = 0;

function buildDigitBoxes() {
  const row = $id('digit-row');
  row.innerHTML = '';
  for (let i = 0; i < DIGITS; i++) {
    const box = document.createElement('div');
    box.className = 'digit-box' + (i === 0 ? ' focused' : '');
    box.dataset.index = i;
    box.setAttribute('aria-label', `Digit ${i+1}`);
    row.appendChild(box);
  }
  updateDigitDisplay();
}

function updateDigitDisplay() {
  const boxes = $id('digit-row').querySelectorAll('.digit-box');
  boxes.forEach((box, i) => {
    box.textContent = digitValues[i] || '';
    box.classList.toggle('focused', i === currentDigit);
    box.classList.toggle('filled', !!digitValues[i]);
  });
}

function focusDigit(i) {
  currentDigit = Math.max(0, Math.min(DIGITS - 1, i));
  updateDigitDisplay();
  $id('digit-hidden').focus();
}

buildDigitBoxes();
$id('digit-row').addEventListener('click', e => {
  const box = e.target.closest('.digit-box');
  if (box) focusDigit(+box.dataset.index);
  else focusDigit(0);
  $id('digit-hidden').focus();
});

$id('digit-hidden').addEventListener('input', e => {
  const val = e.target.value.replace(/\D/g, '');
  e.target.value = '';
  if (!val) return;
  val.split('').forEach(ch => {
    if (currentDigit < DIGITS) {
      digitValues[currentDigit] = ch;
      currentDigit++;
    }
  });
  currentDigit = Math.min(currentDigit, DIGITS - 1);
  updateDigitDisplay();
  if (digitValues.every(Boolean)) joinRoom();
});
$id('digit-hidden').addEventListener('keydown', e => {
  if (e.key === 'Backspace') {
    if (digitValues[currentDigit]) {
      digitValues[currentDigit] = '';
    } else if (currentDigit > 0) {
      currentDigit--;
      digitValues[currentDigit] = '';
    }
    updateDigitDisplay();
    e.preventDefault();
  } else if (e.key === 'ArrowLeft' && currentDigit > 0) {
    currentDigit--; updateDigitDisplay();
  } else if (e.key === 'ArrowRight' && currentDigit < DIGITS - 1) {
    currentDigit++; updateDigitDisplay();
  } else if (e.key === 'Enter') {
    joinRoom();
  }
});

// Tab switcher
function switchTab(tab) {
  const isCreate = tab === 'create';
  $id('tab-create').classList.toggle('active', isCreate);
  $id('tab-join').classList.toggle('active', !isCreate);
  $id('tab-create').setAttribute('aria-selected', isCreate);
  $id('tab-join').setAttribute('aria-selected', !isCreate);
  $id('panel-create').hidden = !isCreate;
  $id('panel-join').hidden = isCreate;
  if (!isCreate) { focusDigit(0); }
}

// Save city
try {
  const saved = localStorage.getItem('haven-city');
  if (saved) $id('city-input').value = saved;
} catch(_) {}

function copySetupCode() { copyToClipboard(generatedCode); }
function copyRoomCode() { copyToClipboard(roomCode); }

// ——— Create / Join ———
function createRoom() {
  const city = $id('city-input').value.trim() || 'Unknown';
  roomCode = generatedCode;
  startPortal(city, roomCode, true);
}

function joinRoom() {
  const city = $id('city-input').value.trim() || 'Unknown';
  const code = digitValues.join('');
  if (code.length !== DIGITS) {
    setStatus('setup-status', 'Enter all 6 digits.');
    focusDigit(digitValues.findIndex(v => !v));
    return;
  }
  roomCode = code;
  startPortal(city, code, false);
}

// ——— Start Portal ———
async function startPortal(city, code, asCreator) {
  cityName = city;
  try { localStorage.setItem('haven-city', city); } catch(_) {}

  setStatus('setup-status', 'Getting camera…');

  try {
    myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch(_) {
    try { myStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(__) { myStream = null; }
  }

  $id('setup-screen').hidden = true;
  $id('portal-screen').removeAttribute('hidden');

  $id('header-city').textContent = city;
  $id('header-code').textContent = code;
  renderWaitingCode(code);
  $id('self-pip-label').textContent = `Haven ${city}`;
  $id('self-rotate-label').textContent = `Haven ${city}`;

  if (myStream) {
    $id('self-preview-bg').srcObject = myStream;
    $id('self-pip-video').srcObject = myStream;
    $id('self-rotate-video').srcObject = myStream;
  }

  showState('waiting');
  setStatus('portal-status', 'Connecting…');

  if (asCreator) await tryBecomeHost(code);
  else await joinAsGuest(code);
}

// ——— PeerJS ———
function tryBecomeHost(code) {
  const oldPeer = myPeer;
  return new Promise(resolve => {
    const p = new Peer(`haven-${code}`);
    p.on('open', id => {
      myPeer = p; myId = id; isHost = true;
      if (oldPeer && !oldPeer.destroyed && oldPeer !== p) oldPeer.destroy();
      setupListeners(); resolve();
    });
    p.on('error', err => {
      p.destroy();
      if (err.type === 'unavailable-id') { joinAsGuest(code).then(resolve); }
      else { showToast('Connection error: ' + err.type, 'err'); resolve(); }
    });
  });
}

function joinAsGuest(code) {
  const guestId = `haven-${code}-${Math.random().toString(36).substr(2,6)}`;
  const oldPeer = myPeer;
  return new Promise(resolve => {
    const p = new Peer(guestId);
    p.on('open', id => {
      myPeer = p; myId = id; isHost = false;
      if (oldPeer && !oldPeer.destroyed && oldPeer !== p) oldPeer.destroy();
      setupListeners(); connectToHost(code); resolve();
    });
    p.on('error', err => { p.destroy(); showToast('Connection error: ' + err.type, 'err'); resolve(); });
  });
}

function setupListeners() {
  myPeer.on('connection', conn => { conn.on('open', () => handleNewDataConn(conn)); });
  myPeer.on('call', call => {
    call.answer(myStream || undefined);
    call.on('stream', stream => {
      const info = peers.get(call.peer) || {};
      info.stream = stream; info.call = call;
      peers.set(call.peer, info); refreshView();
      watchStream(stream, call.peer);
    });
    call.on('close', () => handlePeerGone(call.peer));
    call.on('error', () => handlePeerGone(call.peer));
  });
  myPeer.on('disconnected', () => { if (myPeer && !myPeer.destroyed) myPeer.reconnect(); });
}

function watchStream(stream, peerId) {
  stream.getTracks().forEach(track => {
    track.addEventListener('ended', () => handlePeerGone(peerId), { once: true });
  });
}

function connectToHost(code) {
  const hostId = `haven-${code}`;
  const conn = myPeer.connect(hostId, { reliable: true });
  if (!peers.has(hostId)) peers.set(hostId, {});
  conn.on('open', () => {
    peers.get(hostId).dataConn = conn;
    conn.send({ type: 'hello', cityName });
    callPeer(hostId); updateChips();
  });
  conn.on('data', data => handleDataMsg(hostId, data));
  const reelectHost = () => { handlePeerGone(hostId); if (myPeer && !myPeer.destroyed) setTimeout(() => tryBecomeHost(roomCode), 800); };
  conn.on('close', reelectHost);
  conn.on('error', reelectHost);
}

function handleNewDataConn(conn) {
  const pid = conn.peer;
  if (!peers.has(pid)) peers.set(pid, {});
  peers.get(pid).dataConn = conn;
  conn.on('data', data => handleDataMsg(pid, data));
  conn.on('close', () => handlePeerGone(pid));
  if (isHost) {
    const list = [];
    peers.forEach((info, pid2) => { if (pid2 !== pid) list.push({ id: pid2, cityName: info.cityName || '...' }); });
    conn.send({ type: 'peer-list', peers: list, hostCity: cityName });
    peers.forEach((info, pid2) => { if (pid2 !== pid && info.dataConn?.open) info.dataConn.send({ type: 'new-peer', id: pid, cityName: peers.get(pid)?.cityName || '...' }); });
  }
  callPeer(pid);
}

function handleDataMsg(fromId, data) {
  switch (data.type) {
    case 'hello': { const i = peers.get(fromId)||{}; i.cityName = data.cityName; peers.set(fromId,i); updateChips(); refreshView(); break; }
    case 'peer-list': {
      if (data.hostCity) { const hi = peers.get(fromId)||{}; hi.cityName = data.hostCity; peers.set(fromId,hi); peers.get(fromId)?.dataConn?.send({type:'hello',cityName}); }
      data.peers.forEach(p => { if (p.id !== myId && !peers.has(p.id)) { peers.set(p.id,{cityName:p.cityName}); connectToPeer(p.id); } });
      updateChips(); break;
    }
    case 'new-peer': { if (data.id !== myId && !peers.has(data.id)) { peers.set(data.id,{cityName:data.cityName}); connectToPeer(data.id); updateChips(); } break; }
  }
}

function connectToPeer(peerId) {
  const conn = myPeer.connect(peerId, { reliable: true });
  if (!peers.has(peerId)) peers.set(peerId, {});
  conn.on('open', () => { peers.get(peerId).dataConn = conn; conn.send({type:'hello',cityName}); callPeer(peerId); updateChips(); });
  conn.on('data', data => handleDataMsg(peerId, data));
  conn.on('close', () => handlePeerGone(peerId));
}

function callPeer(peerId) {
  if (!myStream) return;
  const call = myPeer.call(peerId, myStream);
  if (!call) return;
  if (!peers.has(peerId)) peers.set(peerId, {});
  peers.get(peerId).call = call;
  call.on('stream', stream => {
    const info = peers.get(peerId);
    if (info) { info.stream = stream; peers.set(peerId, info); }
    refreshView(); setStatus('portal-status', buildStatusText());
    watchStream(stream, peerId);
  });
  call.on('close', () => handlePeerGone(peerId));
  call.on('error', () => handlePeerGone(peerId));
}

function handlePeerGone(peerId) {
  if (!peers.has(peerId)) return; // re-entry guard
  const info = peers.get(peerId);
  peers.delete(peerId); // delete FIRST so re-entrant calls from close() are no-ops
  if (info) { try { info.call?.close(); } catch(_){} try { info.dataConn?.close(); } catch(_){} }
  updateChips(); refreshView(); setStatus('portal-status', buildStatusText());
}

function buildStatusText() {
  const n = [...peers.values()].filter(i => i.stream).length;
  if (n === 0) return 'Waiting for other Havens…';
  return `${n+1} Havens connected`;
}

// ——— Views ———
function showState(state) {
  ['waiting','single','rotate','gallery'].forEach(s => {
    const el = $id(`state-${s}`);
    if (s === 'gallery') { el.style.display = state === 'gallery' ? 'grid' : 'none'; el.hidden = state !== 'gallery'; }
    else { el.hidden = state !== s; }
  });
  const isMulti = state === 'rotate' || state === 'gallery';
  $id('btn-view-toggle').hidden = !isMulti;
  if (state === 'rotate') { $id('btn-view-toggle').textContent = 'Gallery'; startRotation(); }
  else { stopRotation(); if (state === 'gallery') $id('btn-view-toggle').textContent = 'Portal View'; }
}

function refreshView() {
  const active = [...peers.entries()].filter(([,i]) => i.stream);
  if (!active.length) { showState('waiting'); return; }
  if (active.length === 1) { showState('single'); renderSingle(active[0]); return; }
  if (viewMode === 'gallery') { showState('gallery'); renderGallery(active); }
  else { showState('rotate'); if (rotateIndex >= active.length) rotateIndex = 0; renderRotate(active); }
}

function makeVideoEl(stream) {
  const v = document.createElement('video');
  v.className = 'remote-video-full';
  v.autoplay = true; v.playsInline = true; v.srcObject = stream;
  return v;
}

function makeNoCamPh(cityLabel) {
  const d = document.createElement('div');
  d.className = 'no-cam-ph';
  d.innerHTML = `<img class="no-cam-hog" src="images/hedgehog-sleep.jpg" alt=""><span class="no-cam-city">${escHtml(cityLabel)}</span><span>No camera</span>`;
  return d;
}

function renderSingle([, info]) {
  const wrap = $id('single-video-wrap');
  wrap.innerHTML = '';
  wrap.appendChild(info.stream ? makeVideoEl(info.stream) : makeNoCamPh(info.cityName||'...'));
  $id('single-city-name').textContent = info.cityName || '...';
  $id('self-pip-single').hidden = !myStream;
}

function renderRotate(active) {
  if (!active.length) return;
  if (rotateIndex >= active.length) rotateIndex = 0;
  const [, info] = active[rotateIndex];
  const wrap = $id('rotate-video-wrap');
  wrap.innerHTML = '';
  wrap.appendChild(info.stream ? makeVideoEl(info.stream) : makeNoCamPh(info.cityName||'...'));
  $id('rotate-city-name').textContent = info.cityName || '...';
  $id('self-pip-rotate').hidden = !myStream;
  $id('btn-prev').hidden = active.length <= 1;
  $id('btn-next').hidden = active.length <= 1;
}

function renderGallery(active) {
  const grid = $id('state-gallery');
  grid.innerHTML = '';
  const total = active.length + 1;
  const cols = total <= 2 ? 2 : total <= 4 ? 2 : 3;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${Math.ceil(total/cols)}, 1fr)`;

  const selfCell = document.createElement('div');
  selfCell.className = 'grid-cell self-cell';
  if (myStream) { const v = document.createElement('video'); v.autoplay=true; v.muted=true; v.playsInline=true; v.srcObject=myStream; v.style.cssText='width:100%;height:100%;object-fit:cover;'; selfCell.appendChild(v); }
  else { selfCell.appendChild(makeNoCamPh(cityName)); }
  const sl = document.createElement('div'); sl.className='grid-label'; sl.textContent=`Haven ${cityName} (you)`; selfCell.appendChild(sl); grid.appendChild(selfCell);

  active.forEach(([, info]) => {
    const cell = document.createElement('div'); cell.className='grid-cell';
    cell.appendChild(info.stream ? makeVideoEl(info.stream) : makeNoCamPh(info.cityName||'...'));
    const lbl = document.createElement('div'); lbl.className='grid-label'; lbl.textContent=`Haven ${escHtml(info.cityName||'...')}`; cell.appendChild(lbl); grid.appendChild(cell);
  });
}

function toggleViewMode() {
  viewMode = viewMode === 'rotate' ? 'gallery' : 'rotate';
  refreshView();
}
function rotatePrev() { const a = [...peers.entries()].filter(([,i])=>i.stream); if(!a.length) return; rotateIndex=(rotateIndex-1+a.length)%a.length; renderRotate(a); resetRotation(); }
function rotateNext() { const a = [...peers.entries()].filter(([,i])=>i.stream); if(!a.length) return; rotateIndex=(rotateIndex+1)%a.length; renderRotate(a); resetRotation(); }

function startRotation() {
  stopRotation(); rotateSecondsLeft = rotationSec; updateRotationBadge();
  rotateTimerId = setInterval(() => { rotateSecondsLeft--; if(rotateSecondsLeft<=0){rotateNext();rotateSecondsLeft=rotationSec;} updateRotationBadge(); }, 1000);
}
function stopRotation() { if(rotateTimerId){clearInterval(rotateTimerId);rotateTimerId=null;} }
function resetRotation() { rotateSecondsLeft=rotationSec; updateRotationBadge(); }
function updateRotationBadge() {
  const m=Math.floor(rotateSecondsLeft/60), s=rotateSecondsLeft%60;
  $id('rotation-badge').textContent = `Next: ${m}:${s.toString().padStart(2,'0')}`;
}

function updateChips() {
  const c = $id('peer-chips');
  c.innerHTML = '';
  const self = document.createElement('div'); self.className='chip';
  self.innerHTML = `<div class="chip-dot self"></div>Haven ${escHtml(cityName)}<span style="opacity:0.45;font-size:0.68em;margin-left:3px">(you)</span>`;
  c.appendChild(self);
  peers.forEach(info => {
    const chip = document.createElement('div'); chip.className='chip';
    chip.innerHTML = `<div class="chip-dot ${info.stream?'live':'wait'}"></div>Haven ${escHtml(info.cityName||'...')}`;
    c.appendChild(chip);
  });
  setStatus('portal-status', buildStatusText());
}

function disconnect() {
  stopRotation();
  if(myStream){myStream.getTracks().forEach(t=>t.stop());myStream=null;}
  peers.forEach(info=>{try{info.call?.close();}catch(_){}try{info.dataConn?.close();}catch(_){}});
  peers.clear();
  if(myPeer&&!myPeer.destroyed){myPeer.destroy();myPeer=null;}
  $id('portal-screen').hidden = true;
  $id('setup-screen').hidden = false;
  digitValues = Array(DIGITS).fill(''); currentDigit = 0;
  generatedCode = generateCode(); renderCodeDisplay(generatedCode, 'create-code-row'); buildDigitBoxes();
  viewMode='rotate'; rotateIndex=0;
}

document.addEventListener('keydown', e => {
  if($id('portal-screen').hidden) return;
  if(e.target.tagName==='INPUT') return;
  if(e.key==='Escape') closeSettings();
  if(e.key==='ArrowLeft') rotatePrev();
  if(e.key==='ArrowRight') rotateNext();
  if(e.key==='g'||e.key==='G') toggleViewMode();
});

// ——— Settings ———
function openSettings() {
  $id('settings-city').value = cityName;
  $id('settings-code-val').textContent = roomCode;
  // Highlight active interval button
  document.querySelectorAll('.interval-btn').forEach(btn => {
    btn.classList.toggle('active', +btn.dataset.secs === rotationSec);
  });
  $id('settings-modal').removeAttribute('hidden');
  setTimeout(() => $id('settings-city').focus(), 60);
}
function closeSettings() {
  $id('settings-modal').hidden = true;
}
function settingsBackdropClick(e) {
  if (e.target === $id('settings-modal')) closeSettings();
}

function applyCityName(val) {
  const v = val.trim() || 'Unknown';
  cityName = v;
  $id('header-city').textContent = v;
  $id('self-pip-label').textContent = `Haven ${v}`;
  $id('self-rotate-label').textContent = `Haven ${v}`;
  try { localStorage.setItem('haven-city', v); } catch(_) {}
  // Broadcast rename to connected peers
  peers.forEach(info => {
    if (info.dataConn?.open) info.dataConn.send({ type: 'hello', cityName: v });
  });
  updateChips();
}

function setRotationInterval(secs) {
  rotationSec = secs;
  document.querySelectorAll('.interval-btn').forEach(btn => {
    btn.classList.toggle('active', +btn.dataset.secs === secs);
  });
  if (rotateTimerId) startRotation(); // restart with new interval
}

// ——— Mic / Camera toggles ———
function toggleMic() {
  if (!myStream) return;
  micMuted = !micMuted;
  myStream.getAudioTracks().forEach(t => { t.enabled = !micMuted; });
  $id('btn-mic').classList.toggle('muted', micMuted);
  $id('icon-mic-on').hidden = micMuted;
  $id('icon-mic-off').hidden = !micMuted;
}

function toggleCam() {
  if (!myStream) return;
  camOff = !camOff;
  myStream.getVideoTracks().forEach(t => { t.enabled = !camOff; });
  $id('btn-cam').classList.toggle('muted', camOff);
  $id('icon-cam-on').hidden = camOff;
  $id('icon-cam-off').hidden = !camOff;
}
</script>
